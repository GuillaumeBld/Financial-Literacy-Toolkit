[databases]
financial_literacy = host=finlit-postgres-db-g6ifwu port=5432 dbname=financial_literacy

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling - best for web apps
; Connections are returned to pool after each transaction
pool_mode = transaction

; Client connections (from app instances)
max_client_conn = 600
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Server connections (to PostgreSQL)
; Keep this modest - actual concurrent queries limited by CPU cores
max_db_connections = 50

; Timeouts
server_idle_timeout = 60
client_idle_timeout = 300
query_timeout = 30
query_wait_timeout = 60

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Admin console (for monitoring)
admin_users = finlit_user
stats_users = finlit_user
