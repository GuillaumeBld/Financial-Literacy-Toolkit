# GitHub Actions workflow for Dokploy deployment
# This workflow is optional - Dokploy can use webhooks directly
# But this provides additional deployment tracking

name: Deploy to Dokploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Deployment
        run: |
          echo "Deployment triggered for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Dokploy will automatically deploy via webhook"
          
  # Optional: Add deployment status updates
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Update Deployment Status
        run: |
          echo "✅ Code pushed to GitHub"
          echo "🔄 Dokploy will build and deploy automatically"
          echo "⏱️  Expected deployment time: 2-5 minutes"



