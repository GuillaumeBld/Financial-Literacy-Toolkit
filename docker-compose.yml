version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: financial_literacy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finlit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-financial_literacy}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration/supabase-to-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migration/migrate-rls-policies.sql:/docker-entrypoint-initdb.d/02-rls-policies.sql:ro
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finlit_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application (for local development)
  # In production, this will be managed by Dokploy
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: financial_literacy_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-finlit_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-financial_literacy}
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
    name: financial_literacy_postgres_data

networks:
  app_network:
    driver: bridge
    name: financial_literacy_network



