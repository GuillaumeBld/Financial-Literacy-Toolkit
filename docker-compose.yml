services:
  # Next.js Application
  # Database: Dokploy-managed PostgreSQL via PgBouncer (finlit-pgbouncer:6432)
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: financial_literacy_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Connect through PgBouncer for 500 concurrent user scaling
      DATABASE_URL: postgresql://finlit_user:${POSTGRES_PASSWORD:-change_me_in_production}@finlit-pgbouncer:6432/financial_literacy
      # Redis L2 cache for shared caching across replicas
      REDIS_URL: redis://finlit-redis:6379
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./exports:/app/shared-documents:ro
    ports:
      - "3000:3000"
    networks:
      - app_network
      - traefik_proxy
      - dokploy-network
    labels:
      - "traefik.enable=true"
      
      # HTTPS Router
      - "traefik.http.routers.finlit.rule=Host(`financial-literacy.qualiaai.fr`)"
      - "traefik.http.routers.finlit.entrypoints=websecure"
      - "traefik.http.routers.finlit.tls.certresolver=le"
      - "traefik.http.services.finlit.loadbalancer.server.port=3000"
      
      # HTTP Router (Redirect to HTTPS)
      - "traefik.http.routers.finlit-http.rule=Host(`financial-literacy.qualiaai.fr`)"
      - "traefik.http.routers.finlit-http.entrypoints=web"
      - "traefik.http.routers.finlit-http.middlewares=redirect-to-https-finlit"
      - "traefik.http.middlewares.redirect-to-https-finlit.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https-finlit.redirectscheme.permanent=true"

      # Buffering middleware
      - "traefik.http.middlewares.finlit-buffer.buffering.maxResponseBodyBytes=10485760"
      - "traefik.http.middlewares.finlit-buffer.buffering.retryExpression=IsNetworkError() && Attempts() < 3"
      - "traefik.http.routers.finlit.middlewares=finlit-buffer@docker"
      
      # Priority to avoid conflicts with other routers for the same domain
      - "traefik.http.routers.finlit.priority=100"
      - "traefik.docker.network=traefik_proxy"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app_network:
    driver: bridge
    name: financial_literacy_network
  traefik_proxy:
    external: true
  dokploy-network:
    external: true